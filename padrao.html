<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
  <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #eef3f8;
            color: #333;
            line-height: 1.6;
        }

        header {
            background: #12345a;
            color: #fff;
            text-align: center;
            padding: 30px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        nav {
            max-width: 1100px;
            margin: 25px auto;
            padding: 25px;
            background: #fff;
            border: 1px solid #d5dfeb;
            border-radius: 6px;
        }

        nav h3 {
            margin-top: 0;
            color: #12345a;
        }

        nav ul {
            padding-left: 22px;
            margin-bottom: 0;
        }

        nav li {
            margin: 7px 0;
        }

        a {
            color: #1d527f;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 0 20px 30px;
        }

        section {
            background: #fff;
            border: 1px solid #d5dfeb;
            border-radius: 6px;
            padding: 25px;
            margin: 25px auto;
        }

        section h2 {
            color: #12345a;
            border-bottom: 2px solid #dce8f3;
            padding-bottom: 10px;
            margin-top: 0;
        }

        section h3 {
            color: #1d527f;
            margin-top: 25px;
        }

        p {
            text-align: justify;
        }

        figure {
            margin: 25px auto;
            text-align: center;
        }

        figure img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 0 auto;
            border: 1px solid #d5dfeb;
            border-radius: 4px;
        }

        figcaption {
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #345b7d;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: #fff;
        }

        th,
        td {
            border: 1px solid #cbd7e4;
            padding: 11px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #dce8f3;
            color: #12345a;
        }

        tr:nth-child(even) {
            background: #f5f8fb;
        }

        td ul {
            margin-top: 5px;
            margin-bottom: 5px;
            padding-left: 22px;
        }

        .voltar {
            display: inline-block;
            margin-top: 15px;
            font-weight: bold;
        }

        footer {
            background: #12345a;
            color: #fff;
            text-align: center;
            padding: 25px 15px;
            margin-top: 30px;
        }

        footer p {
            text-align: center;
            margin: 5px 0;
        }

        footer a {
            display: inline-block;
            margin-top: 12px;
            color: #fff;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            header {
                padding: 22px 15px;
            }

            header h1 {
                font-size: 22px;
            }

            nav,
            section {
                padding: 18px;
                margin: 15px;
            }

            main {
                padding: 0 5px 20px;
            }

            table {
                font-size: 13px;
            }

            th,
            td {
                padding: 8px;
            }
        }
    </style>
<body>
    <main>
      1.1	TELAS DE OPERAÇÃO PADRÕES

             Nesse tópico serão abordadas as POPUPS de operação padrão do sistema. 

    </main>


      <a href="./index.html"> <button> VOLTAR </button> </a>
</body>
</html>
